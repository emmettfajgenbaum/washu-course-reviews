# Monthly data refresh: WashU undergrad catalog from bulletin.wustl.edu and
# professor ratings from RateMyProfessors.
#
# Runs on GitHub Actions rather than Vercel Cron because the rate-limited crawl
# takes minutes (past Hobby function limits). Requires two repository secrets
# that mirror the Vercel production values (docs/washu-prod-env-vars.md):
#   NEXT_PUBLIC_SUPABASE_URL
#   SUPABASE_SERVICE_ROLE_KEY
#
# Scheduled runs apply. Manual runs are a DRY-RUN PREVIEW unless the
# "Write changes" box is checked — a stray click can never write to production.
# Every run uploads sync-courses-plan.json (the full change plan, including
# the previous value of every field an update touches) as an artifact; that
# artifact is the recovery record if a run ever writes garbage.

name: Sync course and RMP data

on:
  schedule:
    - cron: "20 9 3 * *" # 3rd of every month, 09:20 UTC
  workflow_dispatch:
    inputs:
      write:
        description: "Write changes (leave unchecked to preview only)"
        type: boolean
        default: false

permissions:
  contents: read
  actions: write # lets the run reset GitHub's scheduled-workflow inactivity timer

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      APPLY_FLAG: ${{ (github.event_name == 'schedule' || inputs.write == true) && '--apply' || '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Sync courses from the WashU bulletin
        run: node scripts/sync-courses.js $APPLY_FLAG

      # RMP is an independent data source — a bulletin-side failure must not
      # freeze professor ratings too, so this step runs even if the previous
      # one failed.
      - name: Sync professor ratings from RateMyProfessors
        if: ${{ !cancelled() }}
        run: node scripts/sync-rmp.js $APPLY_FLAG

      - name: Upload the course change plan (recovery record)
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: sync-courses-plan
          path: sync-courses-plan.json
          if-no-files-found: ignore
          retention-days: 90

      # GitHub disables scheduled workflows after 60 days without repository
      # activity. Re-enabling our own workflow on every run resets that timer,
      # so the monthly sync keeps firing on a repo that is otherwise quiet.
      - name: Reset the scheduled-workflow inactivity timer
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/sync-data.yml/enable"
