# Monthly data refresh: WashU undergrad catalog from bulletin.wustl.edu, and
# new RateMyProfessors ratings imported as reviews.
#
# Runs on GitHub Actions rather than Vercel Cron because the rate-limited crawl
# takes minutes (past Hobby function limits). Requires two repository secrets
# that mirror the Vercel production values (docs/washu-prod-env-vars.md):
#   NEXT_PUBLIC_SUPABASE_URL
#   SUPABASE_SERVICE_ROLE_KEY
#
# Scheduled runs apply. Manual runs are a DRY-RUN PREVIEW unless the
# "Write changes" box is checked — a stray click can never write to production.
# Every run uploads both change plans as artifacts — sync-courses-plan.json
# (including the previous value of every field an update touches) and
# sync-rmp-reviews-plan.json (every inserted row and every skip with its
# reason); they are the recovery record if a run ever writes garbage.

name: Sync courses and reviews

on:
  schedule:
    - cron: "20 9 3 * *" # 3rd of every month, 09:20 UTC
  workflow_dispatch:
    inputs:
      write:
        description: "Write changes (leave unchecked to preview only)"
        type: boolean
        default: false

permissions:
  contents: read
  actions: write # lets the run reset GitHub's scheduled-workflow inactivity timer

jobs:
  sync:
    runs-on: ubuntu-latest
    # ~5 min of bulletin crawl plus ~15 min of RMP (one request per rated
    # professor); the rest is headroom for a slow RMP, since a timeout skips
    # the artifact uploads below.
    timeout-minutes: 50
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      APPLY_FLAG: ${{ (github.event_name == 'schedule' || inputs.write == true) && '--apply' || '' }}
    steps:
      - uses: actions/checkout@v4

      # Node 22+ required: @supabase/supabase-js constructs a RealtimeClient on
      # createClient(), which needs a native global WebSocket. Node 20 has none,
      # so both scripts died at startup here while working fine on a dev machine
      # running a newer Node. Do not lower this.
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Sync courses from the WashU bulletin
        run: node scripts/sync-courses.js $APPLY_FLAG

      # RMP is an independent data source — a bulletin-side failure must not
      # freeze the review import too, so this step runs even if the previous
      # one failed. Dry-run by default; --max-insert keeps a matching bug from
      # mass-inserting (see the script header).
      - name: Import new RateMyProfessors ratings as reviews
        if: ${{ !cancelled() }}
        run: node scripts/sync-rmp-reviews.js $APPLY_FLAG

      - name: Upload the course change plan (recovery record)
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: sync-courses-plan
          path: sync-courses-plan.json
          if-no-files-found: ignore
          retention-days: 90

      - name: Upload the review import plan (recovery record)
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: sync-rmp-reviews-plan
          path: sync-rmp-reviews-plan*.json
          if-no-files-found: ignore
          retention-days: 90

      # GitHub disables scheduled workflows after 60 days without repository
      # activity. Re-enabling our own workflow on every run resets that timer,
      # so the monthly sync keeps firing on a repo that is otherwise quiet.
      - name: Reset the scheduled-workflow inactivity timer
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/sync-data.yml/enable"
